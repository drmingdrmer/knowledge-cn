{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    </header>
    <div class="post-layout">
      <div class="prose">{{ .Content }}</div>
      {{ if .Params.toc }}
        <aside class="toc" aria-label="本页目录">
          <h2>本页目录</h2>
          {{ .TableOfContents }}
        </aside>
      {{ end }}
    </div>
  </article>
{{ end }}

name: Build and deploy knowledge-cn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v$HUGO_VERSION"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build the site
        run: hugo --gc --minify --panicOnWarning

      - name: Check links and bundled content
        run: python3 tests/test_site.py

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
